name: Run Tox Tests

env:
  PYTHONFAULTHANDLER: "1"
  PYTHONMALLOC: "debug"
  MallocNanoZone: "0"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rapidgzip-version-tests:
    name: Tox - py${{ matrix.python-version }}-rapidgzip-${{ matrix.rapidgzip-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
        rapidgzip-version: ["0.14.3", "0.14.4", "0.14.5", "0.15.0", "0.15.1", "0.15.2"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            uv tool install tox --with tox-uv
          else
            pip install tox
          fi

      - name: Install unrar (for rarfile tests)
        shell: bash
        run: scripts/install_unrar.sh

      - name: Install ncompress (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y ncompress

      - name: Run tox environment under debugger
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y gdb
            gdb -q -ex "run" -ex "bt" -ex "quit" --args \
              tox -e py${{ matrix.python-version }}-rapidgzip-${{ matrix.rapidgzip-version }} \
              -- -vv -k "not test_open_url and not test_corrupted_archives and not test_nested_compressed_archives"
          else
            lldb -Q -- \
              tox -e py${{ matrix.python-version }}-rapidgzip-${{ matrix.rapidgzip-version }} \
              -- -vv -k "not test_open_url and not test_corrupted_archives and not test_nested_compressed_archives" \
              -o "run" -o "bt" -o "quit"
          fi

      - name: Run URL test
        run: tox -e py${{ matrix.python-version }}-rapidgzip-${{ matrix.rapidgzip-version }} -- -vv tests/archivey/test_open_url.py

      - name: Run corrupted files test
        run: tox -e py${{ matrix.python-version }}-rapidgzip-${{ matrix.rapidgzip-version }} -- -vv tests/archivey/test_corrupted_archives.py

      - name: Run nested archives test
        run: tox -e py${{ matrix.python-version }}-rapidgzip-${{ matrix.rapidgzip-version }} -- -vv tests/archivey/test_nested_compressed_archives.py
